<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Formulario de soporte técnico</title>
</head>

<body>

<header>
    <h1>Solicitud de soporte técnico</h1>
    <p>Rellena este formulario para notificar alguna incidencia informática.</p>
</header>

<main>

    <form>

        <fieldset>
            <legend>Datos del usuario</legend>

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre"
            placeholder="Escribe tu nombre" required>

            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo"
            placeholder="ejemplo@gmail.com" required>

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono"
            placeholder="Ej. 600123456">

        </fieldset>

        <fieldset>
            <legend>Datos de la incidencia</legend>
            <label for="incidencia">Tipo de incidencia:</label>

            <select id="incidencia" name="incidencia" required>
                <option value="">Selecciona una opción</option>
                <option value="hardware">Hardware</option>
                <option value="software">Software</option>
                <option value="red">Red</option>
                <option value="otros">Otros</option>
            </select>

            <label for="equipo">Equipo afectado:</label>
            <input type="text" id="equipo" name="equipo"
            placeholder="Ej. Ordenador" required>

            <label for="prioridad">Prioridad de la incidencia:</label>

            <select id="prioridad" name="prioridad" required>
                <option value="">Selecciona una prioridad</option>
                <option value="baja">Baja</option>
                <option value="media">Media</option>
                <option value="alta">Alta</option>
            </select>

            <label for="fecha">Fecha de la incidencia:</label>
            <input type="date" id="fecha" name="fecha">

            <label for="descripcion">Descripción del problema:</label>

            <textarea id="descripcion" name="descripcion"
            rows="5" cols="40"
            placeholder="Explica qué problema tienes..."
            required></textarea>

        </fieldset>

        <fieldset>
            <legend>Información adicional</legend>
            <p>¿Se ha repetido este problema?</p>

            <input type="radio" id="si" name="repetido" value="si">
            <label for="si">Sí</label>

            <input type="radio" id="no" name="repetido" value="no">
            <label for="no">No</label>

        </fieldset>

        <button type="submit">Enviar solicitud</button>

        <button type="reset">Limpiar formulario</button>

    </form>
</main>
</body>
</html>
